<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>THYNK | Coming Soon</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-1: #02050d;
			--bg-2: #071325;
			--bg-3: #101c36;
			--ink: #eaf3ff;
			--muted: #b4c7de;
			--brand: #1792d3;
			--brand-deep: #0f6ca8;
			--accent: #ff8a3d;
			--card: rgba(6, 15, 29, 0.74);
			--stroke: rgba(143, 181, 227, 0.26);
			--shadow: 0 34px 95px rgba(2, 6, 16, 0.7);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Outfit", "Segoe UI", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(circle at 18% 24%, rgba(23, 146, 211, 0.36), transparent 55%),
				radial-gradient(circle at 86% 12%, rgba(255, 138, 61, 0.28), transparent 42%),
				radial-gradient(circle at 52% 92%, rgba(86, 116, 255, 0.22), transparent 52%),
				radial-gradient(circle at 50% 6%, rgba(255, 255, 255, 0.07), transparent 32%),
				linear-gradient(132deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
			overflow: hidden;
		}

		.scene {
			position: relative;
			width: 100%;
			min-height: 100vh;
			display: grid;
			place-items: center;
			perspective: 1400px;
			padding: 24px;
		}

		.aurora {
			position: absolute;
			border-radius: 50%;
			filter: blur(8px);
			pointer-events: none;
			opacity: 0.92;
			animation: drift 12s ease-in-out infinite alternate;
		}

		.aurora.one {
			width: 340px;
			height: 340px;
			background: radial-gradient(circle, rgba(23, 146, 211, 0.62), rgba(23, 146, 211, 0));
			top: 10%;
			left: 6%;
		}

		.aurora.two {
			width: 300px;
			height: 300px;
			background: radial-gradient(circle, rgba(255, 138, 61, 0.5), rgba(255, 138, 61, 0));
			right: 4%;
			bottom: 11%;
			animation-delay: 1.6s;
		}

		.card {
			width: min(980px, 100%);
			border: 1px solid var(--stroke);
			border-radius: 30px;
			background: var(--card);
			-webkit-backdrop-filter: blur(16px);
			backdrop-filter: blur(16px);
			box-shadow: var(--shadow);
			transform-style: preserve-3d;
			transform: rotateX(6deg) rotateY(-8deg);
			transition: transform 250ms ease;
			overflow: hidden;
		}

		.mesh {
			position: absolute;
			inset: 0;
			background-image:
				linear-gradient(rgba(146, 196, 244, 0.14) 1px, transparent 1px),
				linear-gradient(90deg, rgba(146, 196, 244, 0.14) 1px, transparent 1px);
			background-size: 26px 26px;
			transform: translateZ(-1px);
			-webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
			mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
			pointer-events: none;
		}

		.inner {
			position: relative;
			padding: clamp(28px, 4vw, 52px);
			display: grid;
			gap: 26px;
			transform-style: preserve-3d;
		}

		.pill {
			width: fit-content;
			padding: 8px 14px;
			border-radius: 999px;
			font-size: 0.85rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #9cdcff;
			background: rgba(23, 146, 211, 0.2);
			border: 1px solid rgba(156, 220, 255, 0.35);
			transform: translateZ(26px);
			animation: reveal 800ms ease both;
		}

		.brand-wrap {
			display: flex;
			justify-content: center;
			transform: translateZ(56px);
			animation: reveal 900ms ease 80ms both;
		}

		.brand-wrap img {
			width: min(720px, 100%);
			height: auto;
			filter: drop-shadow(0 20px 26px rgba(16, 69, 111, 0.2));
		}

		.headline {
			margin: 0;
			font-family: "Space Grotesk", "Outfit", sans-serif;
			font-size: clamp(1rem, 2vw, 3rem);
			line-height: 1;
			letter-spacing: -0.02em;
			text-transform: uppercase;
			text-align: center;
			transform: translateZ(72px);
			animation: reveal 1s ease 160ms both;
		}

		.headline span {
			background: linear-gradient(90deg, var(--brand), var(--accent));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.copy {
			margin: 0 auto;
			max-width: 64ch;
			text-align: center;
			font-size: clamp(1rem, 1.6vw, 1.2rem);
			line-height: 1.55;
			color: var(--muted);
			transform: translateZ(48px);
			animation: reveal 1.05s ease 220ms both;
		}

		.meta {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 10px;
			transform: translateZ(40px);
			animation: reveal 1.12s ease 300ms both;
		}

		.chip {
			padding: 9px 14px;
			border-radius: 999px;
			background: rgba(10, 24, 45, 0.85);
			border: 1px solid rgba(156, 220, 255, 0.23);
			color: #d5e6fb;
			font-size: 0.92rem;
			font-weight: 600;
		}

		.learning-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 14px;
			transform: translateZ(52px);
			animation: reveal 1.1s ease 270ms both;
		}

		.track-card {
			padding: 15px;
			border-radius: 18px;
			background: linear-gradient(145deg, rgba(12, 30, 54, 0.88), rgba(6, 16, 31, 0.9));
			border: 1px solid rgba(152, 210, 255, 0.25);
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
		}

		.track-title {
			margin: 0;
			font-family: "Space Grotesk", "Outfit", sans-serif;
			font-size: 1.05rem;
			color: #f2f8ff;
		}

		.track-copy {
			margin: 8px 0 0;
			font-size: 0.9rem;
			line-height: 1.45;
			color: #b6cae3;
		}

		.code-ribbon {
			margin-top: 12px;
			display: inline-block;
			font-family: "Space Grotesk", monospace;
			font-size: 0.78rem;
			padding: 5px 8px;
			border-radius: 8px;
			background: rgba(0, 0, 0, 0.25);
			color: #8ad9ff;
			border: 1px solid rgba(138, 217, 255, 0.24);
		}

		.actions {
			display: flex;
			justify-content: center;
			gap: 12px;
			flex-wrap: wrap;
			transform: translateZ(34px);
			animation: reveal 1.2s ease 380ms both;
		}

		.button {
			text-decoration: none;
			border-radius: 14px;
			padding: 12px 18px;
			font-weight: 700;
			letter-spacing: 0.01em;
			transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
		}

		.button.primary {
			color: #ffffff;
			background: linear-gradient(96deg, var(--brand), var(--brand-deep));
			box-shadow: 0 14px 28px rgba(22, 116, 176, 0.34);
		}

		.button.secondary {
			color: #dbeafb;
			background: rgba(8, 21, 40, 0.88);
			border: 1px solid rgba(167, 210, 245, 0.35);
		}

		.button:hover {
			transform: translateY(-2px);
		}

		.footer-note {
			text-align: center;
			font-size: 0.92rem;
			color: #a8bfd9;
			transform: translateZ(28px);
			animation: reveal 1.3s ease 460ms both;
		}

		.symbol-stream {
			position: absolute;
			inset: 0;
			pointer-events: none;
			overflow: hidden;
		}

		.symbol-stream span {
			position: absolute;
			font-family: "Space Grotesk", monospace;
			font-size: clamp(0.84rem, 1.4vw, 1rem);
			color: rgba(176, 212, 248, 0.26);
			animation: floatY 16s linear infinite;
		}

		.symbol-stream span:nth-child(1) { top: 12%; left: 7%; animation-delay: -2s; }
		.symbol-stream span:nth-child(2) { top: 22%; right: 6%; animation-delay: -9s; }
		.symbol-stream span:nth-child(3) { top: 64%; left: 9%; animation-delay: -5s; }
		.symbol-stream span:nth-child(4) { top: 78%; right: 8%; animation-delay: -11s; }
		.symbol-stream span:nth-child(5) { top: 38%; right: 18%; animation-delay: -7s; }

		@keyframes drift {
			from {
				transform: translateY(0) scale(1);
			}

			to {
				transform: translateY(-18px) scale(1.05);
			}
		}

		@keyframes reveal {
			from {
				opacity: 0;
				transform: translateY(20px) translateZ(0);
			}

			to {
				opacity: 1;
			}
		}

		@keyframes floatY {
			from {
				transform: translateY(18px);
				opacity: 0.16;
			}

			50% {
				opacity: 0.35;
			}

			to {
				transform: translateY(-22px);
				opacity: 0.1;
			}
		}

		@media (max-width: 860px) {
			body {
				overflow: auto;
			}

			.card {
				transform: none;
			}

			.headline {
				line-height: 1.08;
			}

			.learning-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="scene" id="scene">

	<script>
		const card = document.getElementById("tilt-card");
		const scene = document.getElementById("scene");

		const maxTilt = 10;

		function tiltCard(event) {
			const bounds = scene.getBoundingClientRect();
			const x = (event.clientX - bounds.left) / bounds.width;
			const y = (event.clientY - bounds.top) / bounds.height;

			const rotateY = (x - 0.5) * (maxTilt * 2);
			const rotateX = (0.5 - y) * (maxTilt * 2);

			card.style.transform = `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;
		}

		function resetTilt() {
			card.style.transform = "rotateX(6deg) rotateY(-8deg)";
		}

		if (window.matchMedia("(min-width: 861px)").matches) {
			scene.addEventListener("mousemove", tiltCard);
			scene.addEventListener("mouseleave", resetTilt);
		}
	</script>
</body>
</html>
