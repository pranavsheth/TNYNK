<html lang="en">
<head>
<meta charset="UTF-8">
<title>THYNK Edutech LLP — Letterhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#008AD4;
    --blue-dark:#046BA6;
    --navy:#0A2A43;
    --ink-soft:#5B7285;
    --coral:#FF6B4D;
    --amber:#FFB627;
    --violet:#7C5CFC;
    --green:#2AB889;
    --sky-50:#F6FBFE;
    --sky-100:#EAF6FD;
    --sky-200:#D9EFFC;
    --ph:#9FB0BE;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#DCE6EC;}
  body{
    font-family:'Manrope',sans-serif; color:var(--navy); -webkit-font-smoothing:antialiased;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  @page{ size:210mm 297mm; margin:0; }

  .page{
    width:210mm; height:297mm; background:#fff; margin:18px auto 40px; position:relative;
    box-shadow:0 10px 40px rgba(10,42,67,0.18); overflow:hidden;
    display:flex; flex-direction:column;
  }

  @media print{
    html,body{ background:#fff; }
    .page{ margin:0; box-shadow:none; }
    .no-print{ display:none !important; }
  }

  /* screen-only toolbar */
  .toolbar{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:50;
    background:var(--navy); border-radius:100px; padding:8px 8px 8px 18px;
    display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(10,42,67,0.32);
  }
  .toolbar span{ color:#B9D3E4; font-size:12px; font-weight:600; white-space:nowrap; }
  .toolbar button{
    font-family:'Manrope'; font-weight:700; font-size:12px; border:none; cursor:pointer;
    border-radius:100px; padding:8px 15px; white-space:nowrap;
  }
  .btn-clear{ background:rgba(255,255,255,0.13); color:#fff; }
  .btn-print{ background:var(--blue); color:#fff; }

  /* header */
  .head{
    flex:0 0 auto; padding:15mm 18mm 0; display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .head .logo{ height:18.5mm; display:block; }
  .head .entity{ text-align:right; border-left:2px solid var(--sky-200); padding-left:14px; }
  .head .entity .name{ font-family:'Manrope'; font-weight:800; font-size:12.3px; color:var(--navy); letter-spacing:0.01em; }
  .head .entity .tag{
    font-family:'Space Mono'; font-weight:700; font-size:8px; color:var(--blue);
    letter-spacing:0.1em; text-transform:uppercase; margin-top:4px;
  }
  .head-rule{
    flex:0 0 auto; margin:7mm 18mm 0; height:2.6px; border-radius:2px;
    background:linear-gradient(90deg,var(--blue),var(--violet) 60%,var(--coral));
  }

  /* watermark */
  .watermark{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:155mm; height:auto; opacity:0.055; z-index:0; pointer-events:none;
  }

  /* body */
  .body-wrap{ flex:1 1 auto; min-height:0; overflow:hidden; position:relative; padding:13mm 22mm 8mm; }
  .letter{
    font-family:'Manrope'; font-size:11.2px; line-height:1.9; color:var(--navy);
    outline:none; position:relative; z-index:1; max-width:166mm;
  }
  .letter p{ margin-bottom:10px; }
  .letter .ph{ color:var(--ph); }
  .letter .addr{ margin-bottom:13px; }
  .letter .subject{ font-weight:800; margin-bottom:13px; }
  .letter .sign{ margin-top:30px; }
  .letter .sign .name-line{ font-weight:800; color:var(--navy); margin-top:24px; }

  /* footer */
  .foot-rule{
    flex:0 0 auto; margin:0 18mm; height:2.6px; border-radius:2px;
    background:linear-gradient(90deg,var(--coral),var(--violet) 40%,var(--blue));
  }
  .foot{
    flex:0 0 auto; padding:5.5mm 14mm 11mm; display:flex; align-items:center; justify-content:center;
    gap:9mm; flex-wrap:wrap;
  }
  .foot .item{ display:flex; align-items:center; gap:6px; }
  .foot .ic{
    width:21px; height:21px; min-width:21px; border-radius:7px; background:var(--sky-100);
    display:flex; align-items:center; justify-content:center;
  }
  .foot .ic svg{ width:10.5px; height:10.5px; stroke:var(--blue); }
  .foot .item span{ font-size:9.3px; font-weight:700; color:var(--ink-soft); }
</style>
</head>
